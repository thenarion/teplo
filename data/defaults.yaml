# Значения по умолчанию для расчёта теплообменного аппарата

# Температура после дожигателя, °C (800–1100)
T_afterburner: 900

# Расход дымовых газов на дымососе, м³/ч (15000–30000)
V_fan: 25000

# Тип расхода: "actual" (фактический при рабочих условиях) или "normal" (приведённый к н.у.)
flow_type: "normal"

# Температура газов на дымососе, °C
T_fan: 150

# Температура окружающего воздуха, °C
T_ambient: 20

# Минимальная температура наружного воздуха для подбора антифриза, °C
T_ambient_min: -30

# Максимальная температура наружного воздуха для расчёта АВО, °C
T_ambient_max: 35

# Требуемая температура дымовых газов после теплообменника, °C (100–300)
T_out_target: 150

# Тип охлаждения: "gas_air" или "liquid"
cooling_type: "liquid"

# Тип антифриза: "propylene" или "ethylene"
glycol_type: "propylene"

# Подсос воздуха в циклонах
# Режим: "percent", "m3h", "kgs", "orifice", "o2", "temperature", "empirical"
leak_mode: "percent"
leak_percent: 10  # %

# Для режима "orifice"
leak_Cd: 0.65
leak_A: 0.01  # м²
leak_dp: 1000  # Па

# Для режима "o2"
O2_before: 8.0  # %
O2_after: 10.0  # %

# Для режима "temperature"
T_before_cyclone: 900  # °C
T_after_cyclone: 800  # °C

# Для режима "empirical"
leak_k: 0.05
leak_alpha: 1.0

# Свойства газа
M_flue_gas: 29.0  # кг/кмоль
cp_gas_default: 1.10  # кДж/(кг·К)
cp_air_default: 1.005  # кДж/(кг·К)

# Коэффициент теплопередачи U, Вт/(м²·К)
U_min: 30
U_design: 60
U_max: 120

# Поправочный коэффициент LMTD F
F_lmtd: 0.9

# Запас поверхности, %
surface_margin: 25

# Расчётная скорость газа в аппарате, м/с
v_gas_min: 5
v_gas_max: 10

# Удельная поверхность теплообмена, м²/м³
a_specific: 40

# Параметры газовоздушного охлаждения
dT_air_cooling: 150  # K — нагрев воздуха
v_air: 3  # м/с — скорость воздуха

# Параметры жидкостного охлаждения
dT_liquid: 10  # K — перепад температуры антифриза
v_liquid: 1.2  # м/с — скорость антифриза в трубах
dry_cooler_margin: 15  # % — запас по теплоотдаче АВО
dT_air_dry_cooler: 30  # K — нагрев воздуха в АВО

# Давление, Па
p_atm: 101325
